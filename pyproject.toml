[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hoya-agent"
version = "0.1.0"
description = "HOYA Market Agent — evidence-first crypto market analysis"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "pandas>=2.2,<3.0",
    "boto3>=1.34,<2.0",
    "streamlit>=1.36,<2.0",
    "xhtml2pdf>=0.2.16,<0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.4,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hoya_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring module collaboration (deselect with '-m \"not integration\"')",
    "acceptance: marks end-to-end acceptance tests",
    "live: marks tests that require live network access (deselect with '-m \"not live\"')",
]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
