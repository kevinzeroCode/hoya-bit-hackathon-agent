[project]
name = "hoya-etl-mvp"
version = "0.1.0"
description = "P2 data/evidence ETL prototype for the HOYA market-analysis AI agent"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",   # all data-source adapters
    "boto3>=1.34",   # Amazon Bedrock (bedrock-runtime invoke_model) — competition LLM target
]

[project.optional-dependencies]
gpt = ["openai>=1.0"]   # local-dev GPT mock only (BedrockClient is the production path)
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
