# S11 CD — deploy main to the single EC2 instance after CI passes.
#
# Trigger: `workflow_run` keyed to CI finishing on `main`, so a broken commit
# never reaches the host. `workflow_dispatch` exists for a manual re-run
# without waiting on a new push.
#
# Credentials: a narrowly scoped IAM user (`github-actions-hoya-deploy`), keys
# stored as encrypted repo secrets. Scope is ECR push to this one repository
# plus `ssm:SendCommand`/`GetCommandInvocation` against this one EC2 instance —
# see the inline policy attached to that user for the exact actions/resources.
# No SSH; the deploy runs entirely through SSM Run Command, matching how the
# instance is operated by hand (docs/deployment.md).
name: Deploy to EC2

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: build, push, swap on EC2
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image, tagged with the deployed commit
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          REPO: ${{ vars.ECR_REPO }}
        run: |
          set -euo pipefail
          TAG=$(git rev-parse --short HEAD)
          IMAGE="$REGISTRY/$REPO:$TAG"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Swap the image on EC2 via SSM
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          REGION: ${{ vars.AWS_REGION }}
          ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          TS=$(date +%s)
          PARAMS=$(jq -n --arg image "$IMAGE" --arg region "$REGION" --arg account "$ACCOUNT_ID" --arg ts "$TS" '{
            commands: [
              "set -e",
              "cd /opt/hoya/deploy",
              ("cp .env .env.bak." + $ts),
              ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $account + ".dkr.ecr." + $region + ".amazonaws.com"),
              ("docker pull -q " + $image),
              ("sed -i \"s|^HOYA_IMAGE=.*|HOYA_IMAGE=" + $image + "|\" .env"),
              "docker compose -p hoya -f compose.https.yml up -d"
            ]
          }')
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name "AWS-RunShellScript" \
            --timeout-seconds 300 --parameters "$PARAMS" --query "Command.CommandId" --output text)
          echo "swap command: $CMD_ID"
          if ! aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"; then
            echo "::error::EC2 image swap did not succeed"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query "{out:StandardOutputContent,err:StandardErrorContent}"
            exit 1
          fi
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text

      - name: Smoke test inside the redeployed container
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          SMOKE_B64=$(base64 -w0 scripts/smoke_test.py)
          PARAMS=$(jq -n --arg b64 "$SMOKE_B64" '{
            commands: [
              "for i in $(seq 1 24); do H=$(docker inspect --format \"{{.State.Health.Status}}\" hoya-hoya-agent-1); [ \"$H\" = healthy ] && break; sleep 5; done",
              "docker inspect --format \"IMG={{.Config.Image}} HEALTH={{.State.Health.Status}}\" hoya-hoya-agent-1",
              ("echo " + $b64 + " | base64 -d > /tmp/smoke_test.py"),
              "docker cp /tmp/smoke_test.py hoya-hoya-agent-1:/tmp/smoke_test.py",
              "docker exec hoya-hoya-agent-1 python /tmp/smoke_test.py --base-url http://localhost:8501"
            ]
          }')
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name "AWS-RunShellScript" \
            --timeout-seconds 300 --parameters "$PARAMS" --query "Command.CommandId" --output text)
          set +e
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"
          WAIT_STATUS=$?
          set -e
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          if [ "$WAIT_STATUS" -ne 0 ]; then
            echo "::error::Post-deploy smoke test failed on EC2 — the previous image is still what judges would see, but this deploy did not verify cleanly"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text
            exit 1
          fi
